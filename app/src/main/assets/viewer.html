<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DroidWeb — Remote Control</title>
<style>
  :root {
    --bg: #0e1116;
    --surface: #171c24;
    --surface-2: #1f2530;
    --border: #2a3140;
    --text: #e8ecf1;
    --muted: #8b94a3;
    --accent: #4f9cf9;
    --accent-hover: #6aaefb;
    --good: #3fce7c;
    --warn: #ffb454;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  /* Top bar */
  #bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
  }
  #bar .logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex: none;
  }
  #bar .title { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  #status {
    font-size: 12px; font-weight: 600; padding: 4px 10px;
    border-radius: 999px; background: var(--surface-2);
    color: var(--good); border: 1px solid var(--border);
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  #status::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
  }
  #status.warn { color: var(--warn); }
  #status.bad { color: var(--bad); }
  #stats {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #bar .spacer { flex: 1; }
  #bar a { color: var(--muted); font-size: 13px; text-decoration: none; }
  #bar a:hover { color: var(--text); }
  /* Buttons */
  button {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; font-size: 14px; cursor: pointer;
    font-family: inherit; transition: background .12s, border-color .12s;
  }
  button:hover { background: #2a3140; border-color: #3a4358; }
  button:active { background: #343d4f; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  /* Screen */
  #screen-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px; min-height: 0; background:
      radial-gradient(1200px 600px at 50% -10%, #1a2230 0%, var(--bg) 60%);
  }
  #screen {
    max-width: 100%; max-height: 100%;
    border-radius: 12px; border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
    touch-action: none; user-select: none; -webkit-user-select: none;
    background: #000; display: block;
  }
  #hint {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 6px 12px 0;
  }
  /* Bottom controls */
  #controls {
    padding: 10px 14px 14px; background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }
  #nav-row { display: flex; gap: 8px; }
  #nav-row button { flex: 1; }
  #keys { display: flex; gap: 8px; }
  #keys input {
    flex: 1; min-width: 0; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 15px; font-family: inherit; outline: none;
  }
  #keys input:focus { border-color: var(--accent); }
  @media (max-width: 560px) {
    #bar .title { display: none; }
    #stats { display: none; }
    #nav-row button { padding: 7px 6px; font-size: 13px; }
  }
</style>
</head>
<body>
<div id="bar">
  <span class="logo">D</span>
  <span class="title">DroidWeb</span>
  <span id="status">connecting…</span>
  <span id="stats"></span>
  <span class="spacer"></span>
  <button id="fullscreen" title="Fullscreen">&#9974;</button>
  <a href="/logout">Log out</a>
</div>
<div id="screen-wrap"><img id="screen" alt="device screen"></div>
<div id="hint">Tap the screen to tap &middot; drag to swipe &middot; keyboard: Backspace, Esc, Enter, arrows</div>
<div id="controls">
  <div id="nav-row">
    <button id="back">&#9664; Back</button>
    <button id="home">Home</button>
    <button id="recents">Recents</button>
  </div>
  <div id="keys">
    <input id="text" placeholder="Type text…" autocomplete="off">
    <button id="send-text" class="primary">Send</button>
    <button id="enter">Enter &crarr;</button>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var img = document.getElementById('screen');
  var statusEl = document.getElementById('status');
  var statsEl = document.getElementById('stats');

  function setStatus(kind, msg) {
    // kind: 'ok' | 'warn' | 'bad'
    statusEl.textContent = msg;
    statusEl.className = kind === 'ok' ? '' : kind;
  }

  function streamUrl() {
    var u = '/stream' + (token ? '?token=' + encodeURIComponent(token) : '');
    // Cache-buster so a reconnect never replays a stale/broken stream.
    u += (u.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    return u;
  }

  // ---- auto-reconnecting MJPEG stream -------------------------------
  var reconnectDelay = 1000;   // start at 1s, back off to 10s max
  var reconnectTimer = null;
  var streamLive = false;

  function connectStream() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    img.src = streamUrl();
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    streamLive = false;
    setStatus('warn', 'reconnecting…');
    reconnectTimer = setTimeout(function () {
      reconnectTimer = null;
      connectStream();
    }, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  }

  img.onload = function () {
    // First frame arrived — the stream is live again.
    streamLive = true;
    reconnectDelay = 1000;
    setStatus('ok', 'live');
  };
  img.onerror = function () {
    // The MJPEG stream broke. Reconnect by ourselves instead of
    // asking the user to reload the page.
    scheduleReconnect();
  };

  connectStream();

  // ---- heartbeat + fps / latency ------------------------------------
  // Poll /status every 2s. The server reports total frames published;
  // fps = frames delta / time delta. Latency = round-trip of the poll.
  var lastFrames = null, lastTime = 0, lastLatency = null;
  var missedBeats = 0;

  function beat() {
    var t0 = Date.now();
    var url = '/status' + (token ? '?token=' + encodeURIComponent(token) : '');
    fetch(url, { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (s) {
        var now = Date.now();
        lastLatency = now - t0;
        missedBeats = 0;
        if (typeof s.frames === 'number' && lastFrames !== null && now > lastTime) {
          var fps = (s.frames - lastFrames) / ((now - lastTime) / 1000);
          if (fps >= 0 && fps < 100) {
            statsEl.textContent = Math.round(fps) + ' fps · ' + lastLatency + ' ms';
          }
        }
        if (typeof s.frames === 'number') { lastFrames = s.frames; lastTime = now; }
        if (streamLive) setStatus('ok', 'live');
      })
      .catch(function () {
        // Server unreachable — the stream is probably dead too.
        missedBeats++;
        statsEl.textContent = '';
        if (missedBeats >= 2) scheduleReconnect();
      });
  }
  setInterval(beat, 2000);
  beat();

  // ---- fullscreen ----------------------------------------------------
  document.getElementById('fullscreen').onclick = function () {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen();
    }
  };

  function postInput(obj) {
    obj.w = img.clientWidth;
    obj.h = img.clientHeight;
    fetch('/input' + (token ? '?token=' + encodeURIComponent(token) : ''), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj),
      credentials: 'same-origin'
    }).catch(function () { setStatus('bad', 'input failed'); });
  }

  // Pointer input: ONE post per gesture. Only pointerdown/pointerup are
  // used — no click/mousedown handlers, so a tap can never double-fire
  // from compatibility events. The `down` flag pairs each pointerup
  // with exactly one pointerdown.
  var startX = 0, startY = 0, startT = 0, down = false;
  function pos(e) {
    var r = img.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  img.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var p = pos(e);
    startX = p.x; startY = p.y; startT = Date.now(); down = true;
  });
  img.addEventListener('pointerup', function (e) {
    if (!down) return;
    down = false;
    e.preventDefault();
    var p = pos(e);
    var dx = p.x - startX, dy = p.y - startY;
    var dt = Date.now() - startT;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 12 && dt < 400) {
      postInput({ type: 'tap', x: p.x, y: p.y });
    } else {
      postInput({ type: 'swipe', x1: startX, y1: startY, x2: p.x, y2: p.y, durationMs: Math.min(500, Math.max(100, dt)) });
    }
  });
  img.addEventListener('pointercancel', function () { down = false; });
  // Keep the page from scrolling/zooming while touching the screen.
  img.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  // Buttons (one post per click — plain onclick, no pointer handlers).
  document.getElementById('back').onclick = function () { postInput({ type: 'key', key: 'KEYCODE_BACK' }); };
  document.getElementById('home').onclick = function () { postInput({ type: 'key', key: 'KEYCODE_HOME' }); };
  document.getElementById('recents').onclick = function () { postInput({ type: 'key', key: 'KEYCODE_APP_SWITCH' }); };
  document.getElementById('enter').onclick = function () { postInput({ type: 'key', key: 'KEYCODE_ENTER' }); };
  document.getElementById('send-text').onclick = function () {
    var t = document.getElementById('text');
    if (t.value) { postInput({ type: 'text', text: t.value }); t.value = ''; }
  };
  document.getElementById('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { document.getElementById('send-text').click(); }
  });

  // Physical keyboard: Backspace / Enter / Escape / arrows map to device keys.
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'Backspace') { postInput({ type: 'key', key: 'KEYCODE_DEL' }); e.preventDefault(); }
    if (e.key === 'Escape') { postInput({ type: 'key', key: 'KEYCODE_BACK' }); e.preventDefault(); }
    if (e.key === 'Enter') { postInput({ type: 'key', key: 'KEYCODE_ENTER' }); e.preventDefault(); }
    if (e.key === 'ArrowUp') { postInput({ type: 'key', key: 'KEYCODE_DPAD_UP' }); e.preventDefault(); }
    if (e.key === 'ArrowDown') { postInput({ type: 'key', key: 'KEYCODE_DPAD_DOWN' }); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { postInput({ type: 'key', key: 'KEYCODE_DPAD_LEFT' }); e.preventDefault(); }
    if (e.key === 'ArrowRight') { postInput({ type: 'key', key: 'KEYCODE_DPAD_RIGHT' }); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
